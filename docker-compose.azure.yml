version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    platform: linux/amd64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    restart: unless-stopped

  flink-jobmanager:
    image: bkaplan18/flink-jobmanager:latest
    platform: linux/amd64
    ports:
      - "8081:8081"
    command: jobmanager
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        python.executable: /usr/bin/python3
        pipeline.classpaths: file:///opt/flink/lib/flink-sql-connector-kafka-3.0.1-1.18.jar
      MALLOC_ARENA_MAX: "1"
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import http.client; conn=http.client.HTTPConnection('127.0.0.1', 8081, timeout=2); conn.request('GET', '/overview'); r=conn.getresponse(); exit(0 if r.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  flink-taskmanager:
    image: bkaplan18/flink-taskmanager:latest
    platform: linux/amd64
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1728m
        python.executable: /usr/bin/python3
        pipeline.classpaths: file:///opt/flink/lib/flink-sql-connector-kafka-3.0.1-1.18.jar
      MALLOC_ARENA_MAX: "1"
    restart: unless-stopped

  producer:
    image: bkaplan18/producer:latest
    platform: linux/amd64
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATA_DIR: /data
      SPEED_FACTOR: "4.0"
      KAFKA_TOPIC: "taxi-data"
      FLOOD_MODE: "false" # NOTE: PLEASE KEEP THE VALUE AS "false" WHEN DOING NORMAL DEMO. ONLY SWITCH IT TO "true" WHEN DOING BENCHMARKING T2 - T1
    volumes:
      # On the Azure VM, taxi .txt files must be uploaded to:
      # /home/azureuser/data-provider/data
      # The container reads the same files from /data.
      - ./data-provider/data:/data
    restart: on-failure

  flink-processor:
    image: bkaplan18/flink-processor:latest
    platform: linux/amd64
    working_dir: /app
    command: sh -c "python3 wait_for_cluster.py && flink run -m flink-jobmanager:8081 -py flink_manager.py"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        python.executable: /usr/bin/python3
        pipeline.classpaths: file:///opt/flink/lib/flink-sql-connector-kafka-3.0.1-1.18.jar
    restart: unless-stopped

  dashboard:
    image: bkaplan18/dashboard:latest
    platform: linux/amd64
    ports:
      # Azure exposes HTTP on port 80.
      # The Flask dashboard inside the container listens on port 5050.
      - "80:5050"
    depends_on:
      - redis
      - kafka
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
    restart: unless-stopped

  redis-consumer:
    image: bkaplan18/redis-consumer:latest
    platform: linux/amd64
    command: python redis_consumer.py
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: processed-taxi-data
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

  postgres-consumer:
    image: bkaplan18/postgres-consumer:latest
    platform: linux/amd64
    command: python postgres_consumer.py
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: processed-taxi-data

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: taxi_db
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi123
    restart: unless-stopped

  postgres:
    image: postgres:16
    platform: linux/amd64
    environment:
      POSTGRES_DB: taxi_db
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres_data:
